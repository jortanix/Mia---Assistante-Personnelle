name: iOS — TestFlight

# Compile, signe (compte développeur) et envoie le build à TestFlight.
# Déclenchement manuel uniquement (Actions > workflow > Run workflow).
# Secrets requis (Settings > Secrets and variables > Actions) :
#   APPLE_TEAM_ID  : Team ID du compte développeur (Developer Portal).
#   ASC_API_KEY_ID : ID de la clé API App Store Connect.
#   ASC_API_ISSUER_ID : Issuer ID App Store Connect.
#   ASC_API_KEY    : contenu du fichier AuthKey_<ID>.p8 (à l'identique).
# Prérequis : l'app « Mia » (bundle fr.mia.app) doit exister dans App Store
# Connect, l'App ID enregistré côté dev, et la clé API avoir le rôle
# « App Manager » ou « Admin ».
on:
  workflow_dispatch:
    inputs:
      changelog:
        description: "Changelog affiché dans TestFlight"
        required: false
        default: ""

concurrency:
  group: testflight
  cancel-in-progress: true

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
      BUNDLE_ID: fr.mia.app
    steps:
      - uses: actions/checkout@v4

      - name: Installer XcodeGen
        run: brew install xcodegen

      - name: Clé API App Store Connect (AuthKey_<ID>.p8)
        shell: bash
        run: |
          mkdir -p "$HOME/.appstoreconnect/private-keys"
          echo "${{ secrets.ASC_API_KEY }}" > \
            "$HOME/.appstoreconnect/private-keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$HOME/.appstoreconnect/private-keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Générer le projet Xcode
        working-directory: mobile/ios
        run: xcodegen generate

      - name: Archiver (signature automatique via clé App Store Connect)
        working-directory: mobile/ios
        shell: bash
        run: |
          xcodebuild -project Mia.xcodeproj -scheme Mia -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Mia.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private-keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            archive 2>&1 | tee build.log

      - name: Exporter l'IPA
        working-directory: mobile/ios
        shell: bash
        run: |
          cat > ExportOptions.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>signingStyle</key>
              <string>automatic</string>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/Mia.xcarchive \
            -exportPath export \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private-keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Envoyer à TestFlight
        working-directory: mobile/ios
        shell: bash
        run: |
          xcrun altool --upload-app \
            -f export/Mia.ipa \
            -t ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID" \
            --verbose

      - name: Uploader les artefacts (IPA + log)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-build
          path: |
            mobile/ios/build.log
            mobile/ios/export/Mia.ipa
