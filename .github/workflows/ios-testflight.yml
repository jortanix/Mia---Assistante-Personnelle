name: iOS — TestFlight

# Compile, signe (compte développeur) et envoie le build à TestFlight.
# Déclenchement manuel uniquement (Actions > workflow > Run workflow).
# Secrets requis (Settings > Secrets and variables > Actions) :
#   APPLE_TEAM_ID  : Team ID du compte développeur (Developer Portal).
#   ASC_API_KEY_ID : ID de la clé API App Store Connect.
#   ASC_API_ISSUER_ID : Issuer ID App Store Connect.
#   ASC_API_KEY    : contenu du fichier AuthKey_<ID>.p8 (à l'identique).
# Prérequis : l'app « Mia » (bundle fr.mia.app) doit exister dans App Store
# Connect, l'App ID enregistré côté dev, et la clé API avoir le rôle
# « App Manager » ou « Admin ».
on:
  workflow_dispatch:
    inputs:
      changelog:
        description: "Changelog affiché dans TestFlight"
        required: false
        default: ""

concurrency:
  group: testflight
  cancel-in-progress: true

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
      ASC_KEY: ${{ secrets.ASC_API_KEY }}
      BUNDLE_ID: fr.mia.app
    steps:
      - uses: actions/checkout@v5

      - name: Vérifier les secrets requis
        shell: bash
        run: |
          missing=""
          for name in TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY; do
            val="$(printenv "$name" || true)"
            if [ -z "$val" ]; then missing="$missing ${name}"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Secrets GitHub manquants :$missing"
            echo "Ajoute-les dans Settings > Secrets and variables > Actions,"
            echo "puis relance le workflow :"
            echo "  APPLE_TEAM_ID      -> Team ID (developer.apple.com/account -> Membership details)"
            echo "  ASC_API_KEY_ID     -> Key ID de la clé API App Store Connect"
            echo "  ASC_API_ISSUER_ID  -> Issuer ID App Store Connect"
            echo "  ASC_API_KEY        -> contenu du fichier AuthKey_<ID>.p8"
            exit 1
          fi
          echo "✅ Les 4 secrets sont présents."

      - name: Installer XcodeGen
        run: brew install xcodegen

      - name: Clé API App Store Connect (AuthKey_<ID>.p8)
        shell: bash
        run: |
          mkdir -p "$HOME/.appstoreconnect/private-keys"
          KEY_FILE="$HOME/.appstoreconnect/private-keys/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          if ! grep -q "BEGIN PRIVATE KEY" "$KEY_FILE"; then
            echo "::error::ASC_API_KEY ne ressemble pas à un .p8 valide"
            echo "(il doit contenir '-----BEGIN PRIVATE KEY-----')."
            exit 1
          fi
          echo "✅ Clé écrite : $KEY_FILE ($(wc -c < "$KEY_FILE") octets)"

      - name: Générer le projet Xcode
        working-directory: mobile/ios
        run: xcodegen generate

      - name: Archiver (signature automatique via clé App Store Connect)
        working-directory: mobile/ios
        shell: bash
        run: |
          xcodebuild -project Mia.xcodeproj -scheme Mia -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Mia.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private-keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            archive 2>&1 | tee build.log

      - name: Exporter l'IPA
        working-directory: mobile/ios
        shell: bash
        run: |
          cat > ExportOptions.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>stripSwiftSymbols</key>
              <true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/Mia.xcarchive \
            -exportPath export \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private-keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            TEAM_ID="$TEAM_ID"

      - name: Envoyer à TestFlight
        working-directory: mobile/ios
        shell: bash
        run: |
          xcrun altool --upload-app \
            -f export/Mia.ipa \
            -t ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID" \
            --verbose

      - name: Uploader les artefacts (IPA + log)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: testflight-build
          path: |
            mobile/ios/build.log
            mobile/ios/export/Mia.ipa
